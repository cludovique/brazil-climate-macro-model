name: ERL paper model audit

on:
  push:
    branches:
      - paper/erl-draft
    paths:
      - paper/model_audit.R
      - paper/summarize_audit.R
      - paper/baseline_levels.R
      - paper/constraint_audit.R
      - paper/capex_supplier_audit.R
      - paper/engine2_price_validation.R
      - paper/engine2_mapping_audit.R
      - paper/s51_energy_audit.R
      - paper/engine2_other_industry_sensitivity.R
      - paper/engine2_cities_sensitivity.R
      - paper/load_paper_model.R
      - paper/data/engine2_price_bridge_2018.csv
      - paper/data/engine2_price_bridge_2018.md
      - .github/workflows/paper-audit.yml

permissions:
  contents: write

jobs:
  model-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out paper branch
        uses: actions/checkout@v4
        with:
          ref: paper/erl-draft

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install model dependencies
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "readxl", "dplyr", "tidyr", "writexl", "stringr",
            "ggplot2", "scales", "ggrepel", "patchwork", "forcats"
          )
          install.packages(setdiff(pkgs, rownames(installed.packages())))

      - name: Run paper model audit
        run: Rscript paper/model_audit.R

      - name: Summarize mechanism results
        run: Rscript paper/summarize_audit.R

      - name: Calculate baseline levels and percentages
        run: Rscript paper/baseline_levels.R

      - name: Run NDC physical constraint audit
        run: Rscript paper/constraint_audit.R

      - name: Run CAPEX purchaser-supplier audit
        run: Rscript paper/capex_supplier_audit.R

      - name: Run Engine 2 constant-price validation
        run: Rscript paper/engine2_price_validation.R

      - name: Run Engine 2 sector mapping audit
        run: Rscript paper/engine2_mapping_audit.R

      - name: Run S51 energy-use audit
        run: Rscript paper/s51_energy_audit.R

      - name: Run Engine 2 other-industry sensitivity
        run: Rscript paper/engine2_other_industry_sensitivity.R

      - name: Run Engine 2 cities/buildings sensitivity
        run: Rscript paper/engine2_cities_sensitivity.R

      - name: Commit generated audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Generate ERL model audit results [skip ci]"
            git push origin paper/erl-draft
          fi
