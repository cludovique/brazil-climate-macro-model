name: Build ERL paper structure DOCX

on:
  push:
    branches:
      - paper/erl-draft
    paths:
      - "paper/build_paper_structure_docx.py"
      - ".github/workflows/paper-structure-docx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out paper branch
        uses: actions/checkout@v4
        with:
          ref: paper/erl-draft

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DOCX dependency
        run: python -m pip install --upgrade python-docx

      - name: Build paper structure Word file
        run: python paper/build_paper_structure_docx.py

      - name: Commit generated Word file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/ERL_Paper_Overall_Structure_Cenergia.docx
          if git diff --cached --quiet; then
            echo "No DOCX changes to commit."
            exit 0
          fi
          git commit -m "Add ERL paper structure Word document [skip ci]"
          git push
